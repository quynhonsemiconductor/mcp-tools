# =============================================================================
# Code review — AI review of a pull request against QNSC's rules.
#
# Pinned to `@v1`, the shared major alias, which is how every other caller in this organisation
# references the ci repository. It moved to include the reviewer when ci 1.22.0 released.
#
# `rules_ref` is not passed, so the rules are read from the same `v1` the workflow came from — the
# two move together, and a rule change cannot reach this repository without a ci release.
#
# Not a required check, which is a narrower statement than it sounds: this workflow failing cannot fail
# the merge by itself. Its FINDINGS do gate the merge, and that is chosen rather than accidental. `inline_from_severity: all`
# makes every finding a review thread, and `main-protection` requires threads to be resolved before
# merging — so each finding needs an answer. Resolving with a reply explaining why a finding is wrong is
# the intended response; the record is the point.
# =============================================================================

name: Code review

on:
  pull_request:

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Skip pull requests a bot opened, which in practice means Renovate. A dependency bump changes a
    # manifest and a lockfile, and nothing in our rules speaks to that: they are about layering, tenant
    # scoping, accessibility and migrations. The risk a bump does carry is already covered by
    # osv-scanner, Semgrep, and Renovate's own `minimumReleaseAge` — which is why dependency review was
    # deliberately removed from `base.json` rather than written there.
    #
    # It is also the largest avoidable cost: there were 42 open Renovate pull requests across the
    # organisation when this was added, and one review costs roughly 26k tokens.
    if: github.event.pull_request.user.type != 'Bot'
    # No `timeout-minutes` here: GitHub does not allow it on a job that calls a reusable workflow —
    # only name, uses, with, secrets, needs, if and permissions. The bound lives on the job inside
    # ci/.github/workflows/code-review.yml instead, which is the job that actually runs.
    #
    # The reviewer asked for it here and asserted it was supported. It is not, and actionlint rejects
    # the file. Worth keeping as a note: the concern was right, the remedy was confidently wrong.
    permissions:
      contents: read
      pull-requests: write
    uses: quynhonsemiconductor/ci/.github/workflows/code-review.yml@v1
    with:
      product: mcp-tools
      # No sql profile: this repository has no migrations, and no frontend profile because there are
      # no .tsx or .jsx files here at all.
      profiles: typescript,dockerfile,workflows
      # GLM on the Coding Plan endpoint. It speaks OpenAI chat completions rather than Anthropic's
      # protocol, and the default `llm_extra_body` disables Anthropic's thinking block, which that
      # endpoint will not accept — hence all three overrides rather than only the model.
      llm_url: https://open.bigmodel.cn/api/coding/paas/v4
      use_anthropic_protocol: 'false'
      llm_extra_body: '{}'
      model: glm-5.3
      # Only high and critical findings become review threads that must be resolved before merging.
      # Medium and low are collected in the summary comment as advice.
      #
      # `all` was tried and is too strict for this codebase: on one two-file pull request it produced ten
      # findings across four rounds, several of them about comments in the fix for the previous round, and
      # one was a confidently wrong `medium` asserting `timeout-minutes` works on a job calling a reusable
      # workflow. A wrong finding that stalls a branch costs more than a right one in a summary saves.
      #
      # The shared workflow posts a verdict either way, so a clean review says so rather than being
      # indistinguishable from a review that never ran.
      inline_from_severity: high
      # Comments arrive as our own App rather than github-actions[bot]. Identity only.
      app_id: ${{ vars.CODE_REVIEW_APP_ID }}
    secrets:
      llm_token: ${{ secrets.Z_AI_CODING_API_KEY }}
      app_private_key: ${{ secrets.CODE_REVIEW_APP_KEY }}
