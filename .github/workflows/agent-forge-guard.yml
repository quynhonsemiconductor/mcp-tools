# agent-forge test-guard — required check. Fails a PR that deletes assertions,
# drops test files, or adds dependencies without declaring it in the PR body.
# Applies to human PRs too, deliberately — a check that exempts humans is a
# check that tells an agent to open its PR as a human.
#
# THE GUARD ITSELF LIVES IN quynhonsemiconductor/ci — one copy, versioned with the
# rest of the org's CI, instead of a script pasted into every repo that then
# drifts.
#
# Calls the COMPOSITE ACTION, not qnsc-ci's reusable workflow: a job that
# calls a reusable workflow reports its check as `<caller job>/<called job>`,
# so branch protection requiring `test-guard` would match nothing. Calling the
# action keeps the check named `test-guard`.
name: agent-forge test-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    # `edited` matters: approval paths are declared in the PR body, so editing
    # the body to add one must re-run the check.

# No concurrency block, deliberately — combined with the `edited` trigger,
# `cancel-in-progress` is the exact shape that produced false greens on
# this org (see pr-title.yml). Safe here today since no job is guarded
# with `if: action != 'edited'`, but left out because this is a required
# check and the cost of being wrong is a merge that passed unexamined.

permissions:
  contents: read

jobs:
  # The job id IS the check name branch protection sees. Do not rename it.
  test-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard diffs against the merge base
          persist-credentials: false

      - name: capture the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr-body.txt"

      - uses: quynhonsemiconductor/ci/actions/agent-forge-test-guard@v1
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          body-file: ${{ runner.temp }}/pr-body.txt
