# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
# =============================================================================
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    permissions:
      contents: read
      pull-requests: write
