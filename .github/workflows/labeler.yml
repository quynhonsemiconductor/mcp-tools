# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
# =============================================================================
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
    permissions:
      contents: read
      pull-requests: write
