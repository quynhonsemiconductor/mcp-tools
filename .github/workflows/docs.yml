name: Docs

# The documentation site was written for GitHub Pages — mkdocs.yml has carried
# site_url: https://quynhonsemiconductor.github.io/mcp-tools/ from the start — but
# nothing ever published it, so twenty-eight pages of setup guidance existed only for
# people who cloned the repository and read the markdown.
#
# Builds on every pull request that touches the docs, so a broken build is caught in
# review, and publishes only from main.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time, and cancel a superseded build rather than racing it to Pages.
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@e348410e00f449c11e6260cbc02b8bc7e4d5eb27 # v6.0.0
        with:
          python-version: '3.13'

      - name: Install documentation dependencies
        # Pinned in requirements-docs.txt so a build is reproducible and the dependency
        # scanner can identify versions; unpinned entries report as 0.0.0.
        run: pip install --require-hashes=false -r docs/requirements-docs.txt

      - name: Build
        # --strict turns a broken link or a missing nav entry into a failure. The site is
        # only useful if its links work, and a warning nobody reads is not a check.
        working-directory: docs
        run: mkdocs build --strict

      - name: Upload the built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/site

  deploy:
    # Separate job because deployment needs write permissions the build does not, and a
    # build of a pull request must never be able to publish.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
