# One-off verification job: prove the installer's dist:win (NSIS + installer.nsh)
# builds on windows-latest against the committed package-lock.json.
# Not a required check; delete this file once the evidence is recorded (mcp-tools#90).
name: Installer dist:win check

on:
  push:
    branches:
      - ci/installer-dist-win-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build NSIS installer (frozen lockfile)
        working-directory: installer
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qnsc-mcp-installer-win-x64
          path: |
            installer/release/*.exe
            installer/release/*.blockmap
          if-no-files-found: error
