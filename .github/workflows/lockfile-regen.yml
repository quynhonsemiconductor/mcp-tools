# TEMPORARY — regenerates bun.lock on the runner's linux and commits it to this
# branch. Removed as soon as the lock lands; see the PR description.
name: Lockfile regen (TEMPORARY)
on:
  push:
permissions:
  contents: write
  packages: read
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - run: bun install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "ci-lockfile-regen"
          git config user.email "noreply@qnsc.vn"
          if ! git diff --quiet bun.lock; then
            git add bun.lock
            git commit -m "chore(deps): commit the linux-resolved bun.lock"
            git push
          else
            echo "bun.lock already matches the linux resolution"
          fi
