# =============================================================================
# PR title — Conventional Commits, checked on its own.
#
# Kept in its own workflow (not folded into ci.yml) deliberately: this is the
# only check that needs the `edited` pull_request trigger (title can change
# after opening) and needs no repo checkout, so it's cheap. Folding `edited`
# into a workflow that also runs the real test/lint jobs risks a false green —
# an edit combined with `cancel-in-progress` can cancel the real run and
# replace it with one where the heavy jobs are skipped, which GitHub counts as
# passing, which is the bug this guards against.
#
# Release Please derives the CHANGELOG from PR titles, so a malformed title is
# a release defect, not a style nit.
# =============================================================================
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # required by amannn/action-semantic-pull-request

jobs:
  pr-title:
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The org's own action rather than the upstream one directly. Same behaviour — the
      # default types, subject pattern and scope setting here were already identical to
      # its defaults — but the configuration lives in one place, so a change to what the
      # org accepts reaches this repository without editing it.
      #
      # Called as an action from a local job, not as a reusable workflow. A reusable
      # workflow reports its check as `<caller>/<called>`, which would rename this check
      # and leave the branch protection rule requiring `PR title (conventional commits)`
      # matching nothing — and a required check that never reports blocks every merge
      # rather than failing.
      # Pinned to a commit, not the v1 tag. Every other action in this repository is
      # pinned, and a tag can be moved — Semgrep flags the mutable form, correctly. The
      # ci repository's pin-drift job reports when a pin here falls behind.
      - uses: quynhonsemiconductor/ci/actions/pr-title-conventional-commits@501509660d0fb3491569327afc65fdb5c5403a41 # v1
