name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One pin, three jobs. It was written out three times, which is how the version a
# workflow tests on drifts from the version it builds on without anyone editing
# either — the same shape the org's Terraform workflows hoist into TOFU_VERSION.
# release-binaries.yml keeps its own copy: `env` is per-workflow, so there is no
# way to share one value across files short of a repository variable.
env:
  BUN_VERSION: '1.3.11'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun x eslint .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # NO --bail. It stops at the first failing test, which makes a suite with
      # several independent failures take one CI round-trip each to discover — and
      # each partial result reads like a complete one. `reports/` is created first
      # because bun writes its JUnit report there and otherwise every run ends with
      # `JUnitReportFailed: ENOENT`, noise that looks like a test problem.
      # src/generated/setup-docs.ts is a build artifact and is gitignored, so a
      # fresh checkout does not have it. The setup resolver imports it, and its
      # tests assert on real SETUP.md content, so generate it before testing
      # rather than committing generated output.
      - name: Generate embedded setup docs
        run: bun run scripts/collect-setup-docs.ts

      - run: mkdir -p reports && bun test

      - name: Coverage gate
        run: bun run scripts/check-coverage.ts

  build:
    # Builds the binary and starts it. Nothing did this before a tag, and that is how
    # v0.1.3 through v0.1.6 each shipped an executable that exited before serving a
    # request: typecheck and the unit suite both run the source through bun, where the
    # failing code worked, and the release only checked that a build succeeded.
    #
    # One platform, not five. The failure this catches comes from how the bundle is
    # produced, which every target shares, so the native runner is enough and a
    # five-way matrix on every pull request would not find more.
    #
    # No credentials are needed: the release guard requires OAuth secrets only for a
    # tagged build, so a pull request builds without them.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build the binary
        # Bundled MCP servers are skipped: they clone and compile upstream repositories,
        # which is minutes of work that tells us nothing about whether this binary starts.
        env:
          NO_SECURITY_SCAN: 'true'
          NO_BUNDLING: 'true'
          TARGET: bun-linux-x64
          OUTFILE: qnsc-mcp-ci
        run: bun run build:binary
      - name: Start it and ask for its tools
        run: bun run scripts/smoke-binary.ts ./qnsc-mcp-ci
      - name: No OAuth client secret is embedded
        # A canary secret is set deliberately: the check is worth nothing if the variable it guards
        # against is absent, which is the state every pull request would otherwise build in.
        env:
          GITHUB_CLIENT_ID: Ov23liCANARYIDFORCI
          GITHUB_CLIENT_SECRET: CANARY_SECRET_THAT_MUST_NOT_SHIP
        run: |
          NO_SECURITY_SCAN=true NO_BUNDLING=true TARGET=bun-linux-x64 OUTFILE=qnsc-mcp-canary \
            bun run build:binary
          bun run scripts/assert-no-embedded-secret.ts ./qnsc-mcp-canary
