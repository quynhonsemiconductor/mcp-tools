name: browsertools
description: Securely interact with your Confluence spaces, pages, and content.

source:
  repository: https://github.com/AgentDeskAI/browser-tools-mcp
  ref: v1.2.0
  workingDir: browser-tools-mcp
  entrypoint: dist/mcp-server.js

build:
  enabled: false
  command: bun run build

companions:
  - name: browsertools-server
    description: Companion for Browser Tools.
    workingDir: browser-tools-server
    entrypoint: ./dist/browser-connector.js
    build:
      enabled: true
      command: bun run build
      startFunction: main
    staticFiles:
