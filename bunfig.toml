telemetry = false

[install]
exact = true
# registry = "https://registry.npmjs.org"

[define]
EMBEDDED_CREDENTIAL_CONTEXT = "{}"
BUILD_ENVIRONMENT_TIER = '"non-prod"'

[test]
coverage = true
# No coverageThreshold here on purpose: Bun's threshold behaviour changes between
# versions (1.4.0 fails unconditionally, prints nothing, ignores the object form).
# The gate lives in scripts/check-coverage.ts, which reads the lcov report below
# and states its number.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageExclude = []
testSkipPatterns = ["bundled-mcps/**", "node_modules/**"]
preload = ["./src/test-utils/mocks.ts"]
root = "./src"

[test.reporter]
junit = "reports/junit.xml"
